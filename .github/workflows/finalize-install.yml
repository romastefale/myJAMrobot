name: Finalize myJAMrobot 11.0 install

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    if: >-
      (github.event_name == 'issues' && github.event.issue.title == 'FINALIZE_MYJAMROBOT_11_INSTALL') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.title == 'FINALIZE_MYJAMROBOT_11_INSTALL')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct exact audit file and finalize tree
        shell: bash
        run: |
          set -euo pipefail
          cat .audit_parts/part-*.b64 | base64 -d > .contexto-auditavel.md
          test "$(git hash-object .contexto-auditavel.md)" = "cddca22b028a8ef04d123332c645962e43de6a7a"
          rm -rf .audit_parts
          rm -f .github/workflows/finalize-install.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          test "$(git write-tree)" = "48880a06c84cc602ad1fd86262b6e800cef29643"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instalar myJAMrobot 11.0 seguro"
          git push origin HEAD:main
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            gh pr close "${{ github.event.pull_request.number }}" --comment "Instalação concluída na main."
          else
            gh issue close "${{ github.event.issue.number }}" --comment "Instalação concluída na main."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
