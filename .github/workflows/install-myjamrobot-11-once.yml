name: Install myJAMrobot 11.0 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: install-myjamrobot-11-once
  cancel-in-progress: false

jobs:
  install:
    if: github.event.issue.title == 'install-myjamrobot-11.0-secure-once' && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct verified package from Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          XZ_SHA256: f4152ea41cea820496e5f7766bdb4e2ae7322dcbaa3e0c7485899b5c4ae2edf4
          ZIP_SHA256: 00c5b46dc12c60ca4e602b2dbc792c2294ad43aeb8ebef951cbede11419aac04
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          originals = [
              'db1abc5993e0ea4133edeb484229fe5a0dc9faf1',
              '086d588283730444a359a44cbe381fb36a9d06b9',
              'fbf53f6c0d3d24f97c59fddcf6fd7126b1f724fc',
              'f7c0475fcb10faae8b82a62d323710566f221be0',
              '13fe0743982243a87ae8edac351b9adaa9367d1e',
              'a2e3c576bfd5cabfc6a63cb29b7fe29d12f416c7',
              'a28fa515f3a4b50f8576437497a923d69fb4778d',
              '2bdea86c2cb9a0448d9da390aad4de78e98763f4',
              '1b91a235718997c26e15fa556e394390e0f0cbcb',
              '2458c7dd93868548e8f09a0d4c71292a05ac76cf',
              '0e1bb148d24219d1f8aa16ea7fcb66bca1c0aeb0',
          ]
          replacement = [
              'f5bb1da1225cb8b142b7df150c2b9299d81b4f22',
              'd4f15eedc73f0e820666f2b0cbde965ef7de31e9',
              '1a8b4028780b19d865eecf1bb84942ca09750314',
          ]
          expected = os.environ['XZ_SHA256']
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']

          def fetch_blob(sha: str) -> bytes:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'myJAMrobot-installer',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              return base64.b64decode(payload['content'])

          original_bytes = [fetch_blob(sha) for sha in originals]
          replacement_bytes = b''.join(fetch_blob(sha) for sha in replacement)
          candidates = [('original', b''.join(original_bytes))]
          for index in range(len(original_bytes)):
              candidate = b''.join(original_bytes[:index] + [replacement_bytes] + original_bytes[index + 1:])
              candidates.append((f'replacement-at-{index}', candidate))

          for label, candidate in candidates:
              if hashlib.sha256(candidate).hexdigest() == expected:
                  Path('/tmp/package.zip.xz').write_bytes(candidate)
                  print(f'Validated XZ candidate: {label}')
                  break
          else:
              raise SystemExit('No reconstructed candidate matched the expected XZ SHA-256')
          PY

          echo "$XZ_SHA256  /tmp/package.zip.xz" | sha256sum -c -
          xz -dc /tmp/package.zip.xz > /tmp/package.zip
          echo "$ZIP_SHA256  /tmp/package.zip" | sha256sum -c -

      - name: Extract and validate release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release
          mkdir -p /tmp/release
          unzip -q /tmp/package.zip -d /tmp/release
          test -d /tmp/release/myJAMrobot-main
          test ! -e /tmp/release/myJAMrobot-main/.git
          cd /tmp/release/myJAMrobot-main
          test "$(grep -c 'version = \"11.0.0\"' pyproject.toml)" -eq 1
          python -m compileall -q app scripts tests
          python scripts/validate_release.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Replace main with extracted release
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/myJAMrobot-main/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git status --porcelain | wc -l)" -gt 0
          git commit -m 'Instalar myJAMrobot 11.0 seguro'
          git push origin HEAD:main

      - name: Close installation issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --comment 'Instalação concluída e validada na branch main.'
